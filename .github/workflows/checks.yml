name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and offline tests
        run: node --test tests/core.test.cjs tests/offline.test.cjs
      - name: Generated files are up to date
        run: python3 scripts/build.py --check
